[tools]
ni = "30.6.0"
node = "26.13.1"
"npm:cf" = "1.0.0-beta.7"
"npm:npm-check-updates" = "23.1.1"
pnpm = "12.21.0"

# コマンドはすべて mise task に集約する（`mise tasks` で一覧）。
# 依存はルートの package.json だけで管理し、CLI（astro, tsc など）はルートの node_modules/.bin から使う。cf CLI は mise の npm:cf で入れる。
# Cloudflare 操作は cf CLI を使う（wrangler は使わない）。Worker の設定は各 app の cloudflare.config.ts に書く。
# astro build の最後に #ui/cloudflare.mjs が cf 用の Build Output（.cloudflare/output/）を書き出す。

[env]
_.path = ["{{config_root}}/node_modules/.bin"]

[tasks.install]
description = "依存パッケージをインストール（lockfile どおり）"
run = "ni --frozen"

[tasks.update]
description = "ツール（mise upgrade --bump --local）と依存パッケージ（npm-check-updates）を最新にしてインストール"
# lint・テストの前に必ず走る（check / lint / tests の depends）。mise.toml・package.json・pnpm-lock.yaml が書き換わる。
# CI（デプロイ）ではアップデートせず、コミットされた lockfile どおりに検査する。
# --local で、この mise.toml のツールだけを上げる（~/.config/mise のグローバルなツールは触らない）。
# mise run は開始時のツールのパスを後続のタスクにも引き継ぐので、アップデート後のツールで動かすために、
# このタスクの続きと、検査のタスク（check / lint / format-check / docs-check）のコマンドは mise exec 経由で呼ぶ。
run = '''
if [ -n "${CI:-}" ]; then
  echo "CI ではアップデートしません（lockfile どおりに検査します）"
  exit 0
fi
set -e
mise upgrade --bump --local
mise exec -- npm pkg set "packageManager=pnpm@$(mise current pnpm)"
mise exec -- ncu --upgrade
mise exec -- ni
'''

[tasks.build]
description = "app をビルド（例: mise run build --all / --dashboard / --calendar）"
# --<app> は apps/ 配下のディレクトリ名から決まるので、ツールを足しても mise.toml は変えなくてよい
usage = 'arg "[target]..." help="--all または --<app>（複数指定可。例: --dashboard --calendar）" var=#true'
run = '''
available=""
for dir in apps/*/; do
  [ -f "${dir}astro.config.mjs" ] || continue
  available="$available $(basename "$dir")"
done

show_usage() {
  echo "使い方: mise run build --all | --<app>..." >&2
  echo "  --all" >&2
  for app in $available; do echo "  --$app" >&2; done
}

selected=" "
for target in $usage_target; do
  case "$target" in
    --all) selected=" $available " ;;
    --*)
      name="${target#--}"
      case " $available " in
        *" $name "*) selected="$selected$name " ;;
        *) echo "不明な app です: $target" >&2; show_usage; exit 1 ;;
      esac
      ;;
    *) echo "app は --<app> の形で指定してください: $target" >&2; show_usage; exit 1 ;;
  esac
done

if [ "$selected" = " " ]; then
  show_usage
  exit 1
fi

for app in $available; do
  case "$selected" in
    *" $app "*) astro build --root "apps/$app" ;;
  esac
done
'''

[tasks.check]
description = "アップデート → 型チェック（.astro を含むディレクトリは astro check、それ以外は tsc）"
depends = ["update"]
run = '''
for dir in apps/*/ packages/*/; do
  [ -f "$dir/tsconfig.json" ] || continue
  if find "$dir" -name "*.astro" -not -path "*/node_modules/*" -print -quit | grep -q .; then
    mise exec -- astro check --root "$dir"
  else
    mise exec -- tsc --noEmit -p "$dir"
  fi
done
'''

[tasks.lint]
description = "アップデート → 型チェック → oxlint"
depends = ["update", "check"]
run = "mise exec -- oxlint"

[tasks.format]
description = "Prettier で整形"
run = "prettier --write ."

[tasks."format-check"]
description = "Prettier の整形チェック"
wait_for = ["update"]
run = "mise exec -- prettier --check ."

[tasks."docs-check"]
description = "ヘルプ（技術仕様）とチュートリアルの検査（spec・tour があり、tour の対象が実在するか）"
wait_for = ["update"]
run = "mise exec -- node lint/docs.mjs"

[tasks."docs-stale"]
description = "main からコードを変えたのにヘルプ・チュートリアル・技術仕様を更新していない app を表示"
run = "node lint/docs.mjs --stale"

[tasks."chrome-check"]
description = "本番の全 app で共有部分（ヘッダー・フッター・メニュー）のバージョンが揃っているか検査（デプロイ直後は --wait）"
usage = 'flag "--wait" help="反映を待って数回やり直す"'
run = 'node lint/chrome.mjs ${usage_wait:+--wait}'

[tasks."chrome-stale"]
description = "本番で共有部分のバージョンが手元のソースと違う app を JSON の配列で表示（Deploy workflow が使う）"
run = "node lint/chrome.mjs --stale"

[tasks.tests]
description = "アップデート → lint・型チェック → 整形チェック・ヘルプの検査をまとめて実行"
alias = "test"
depends = ["update", "lint", "format-check", "docs-check"]

[tasks.dev]
description = "app を開発サーバーで起動（例: mise run dev calendar）"
usage = 'arg "<app>" help="apps/ 配下の app 名"'
run = 'cd "apps/$usage_app" && cf dev'

[tasks.deploy]
description = "app をビルドして Cloudflare にデプロイ（例: mise run deploy calendar）"
usage = 'arg "<app>" help="apps/ 配下の app 名"'
run = 'cd "apps/$usage_app" && cf deploy'
