name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# デプロイは 1 本ずつ実行する（実行中のデプロイは途中で止めない）
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # mise.toml に固定した node / pnpm / ni / cf を入れる
      - uses: jdx/mise-action@v5

      - run: mise run install
      - run: mise run tests

      # secrets.CF_ID はアカウント ID、secrets.CF_TOKEN は API トークン。cf CLI が読む環境変数名に渡す
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_TOKEN }}
        run: mise run deploy-all
