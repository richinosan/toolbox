    ></rect>
  </g>
  <g clip-path="url(#image-photo)">
    <circle cx="29" cy="15" r="4" fill="#ffd54a"></circle>
    <path d="M1 37 15 20l9 10 5-5 12 12z" fill="url(#image-hill)"></path>
  </g>

  <g filter="url(#image-shadow)">
