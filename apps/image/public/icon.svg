<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="image-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd8ff" />
      <stop offset="1" stop-color="#2f8de4" />
    </linearGradient>
    <linearGradient id="image-hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fd38d" />
      <stop offset="1" stop-color="#14874a" />
    </linearGradient>
    <linearGradient id="image-badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a68bff" />
      <stop offset="1" stop-color="#5b3fd6" />
    </linearGradient>
    <clipPath id="image-photo">
      <rect x="3" y="7" width="36" height="30" rx="5"></rect>
    </clipPath>
    <filter id="image-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow
