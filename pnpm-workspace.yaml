# package.json はルートの 1 つだけで、依存はすべてそこで管理する（app / package ごとに持たない）。
# このファイルは pnpm の設定のためだけに置いている。

allowBuilds:
  esbuild: true
  sharp: true
minimumReleaseAgeExclude:
  - "@cloudflare/build-output-utils@0.8.4"
  - "@cloudflare/config@0.22.0"
# @astrojs/astro2tsx（astro check が使う）は @emnapi/core 1.x に依存するが、対になる @emnapi/runtime を自分では持たず、
# 他のパッケージ（rolldown の wasm 版）が入れる 2.0.0-beta と組み合わされて astro check が落ちる。1.x を明示して揃える。
packageExtensions:
  "@astrojs/astro2tsx":
    dependencies:
      "@emnapi/runtime": "^1.11.3"
# vite は astro 経由でだけ入る。astro が許す範囲に脆弱性のあるバージョン（GHSA-p4f5-76q4-ffq7、8.3.7 で修正）が
# 含まれるので、その範囲に解決されたときは修正済みのバージョンへ引き上げる。
overrides:
  "vite@>=8.0.0 <8.3.7": "^8.3.7"
  # @stryker-mutator/core（mise run mutation）経由でだけ入る。Stryker が許す範囲に脆弱性のあるバージョンしか無いので、
  # 修正済みのバージョンへ引き上げる（qs: GHSA-6pq8-jhm2-2vcw ほか、6.16.1 で修正。minimatch: GHSA-g3hv-75wg-m249、11.0.1 で修正）。
  "qs@<6.16.1": "^6.16.1"
  "minimatch@<11.0.1": "^11.0.1"
# pnpm audit（mise run audit）で無視する脆弱性。修正版がまだ無いものだけを、理由を添えて書く。修正版が出たら消す。
auditConfig:
  ignoreGhsas:
    # picomatch の ReDoS（4.0.7 以下すべてが対象で、修正版が未公開）。astro / vite がビルド時に、
    # このリポジトリの設定に書いたパターンに対してだけ使う。利用者の入力は渡らず、配信するコードにも含まれない。
    - GHSA-fc5q-39xc-vjpf
