packages:
  - apps/*
  - packages/*

# 全 app / package で共有する依存バージョン。各 package.json では "catalog:" で参照する。
catalog:
  "@astrojs/check": ^0.9.10
  "@fontsource/line-seed-jp": ^5.3.1
  astro: ^7.3.5
  oxlint: ^1.86.0
  prettier: ^3.9.9
  prettier-plugin-astro: ^1.1.0
  typescript: ~6.0.3
  wrangler: ^4.145.0

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
